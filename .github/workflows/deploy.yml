name: CI/CD Pipeline - innovatech Frontend

on:
  push:
    branches: [ "deploy" ]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: front-despacho

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Descargar el código fuente
      uses: actions/checkout@v4

    - name: Configurar Credenciales de AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Iniciar sesión en Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Construir, etiquetar y subir imagen a ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: latest
      # Como el Dockerfile suele estar en la raíz del repo del front, 
      # no necesitamos la etiqueta working-directory aquí.
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG